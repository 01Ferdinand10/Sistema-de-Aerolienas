        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-plane"></i>
            <h2>Aeropuerto</h2>
        </div>

        <ul>

            <li>
                <a href="admin.html">
                    <i class="fa-solid fa-chart-line"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="aerolineas.html">
                    <i class="fa-solid fa-building"></i>
                    Aerolíneas
                </a>
            </li>

            <li>
                <a href="aeronaves.html">
                    <i class="fa-solid fa-plane-circle-check"></i>
                    Aeronaves
                </a>
            </li>

            <li>
                <a href="rutas.html">
                    <i class="fa-solid fa-route"></i>
                    Rutas
                </a>
            </li>

            <li class="active">
                <a href="vuelos.html">
                    <i class="fa-solid fa-plane-departure"></i>
                    Vuelos
                </a>
            </li>

            <li>
                <a href="pasajeros.html">
                    <i class="fa-solid fa-users"></i>
                    Pasajeros
                </a>
            </li>

            <li>
                <a href="tripulacion.html">
                    <i class="fa-solid fa-user-tie"></i>
                    Tripulación
                </a>
            </li>
            
            <li>
                <a href="tripulacion_vuelo.html">
                    <i class="fa-solid fa-users-gear"></i>
                    Asignación de Tripulación
                </a>
            </li>

            <li>
                <a href="reservaciones.html">
                    <i class="fa-solid fa-ticket"></i>
                    Reservaciones
                </a>
            </li>

            <li>
                <a href="vistas.html">
                    <i class="fa-solid fa-eye"></i>
                    Vistas SQL
                </a>
            </li>

            <li>
                <a href="procedimientos.html">
                    <i class="fa-solid fa-gears"></i>
                    Procedimientos
                </a>
            </li>

            <li>
                <a href="triggers.html">
                    <i class="fa-solid fa-bolt"></i>
                    Triggers
                </a>
            </li>

            <li>
                <a href="transacciones.html">
                    <i class="fa-solid fa-database"></i>
                    Transacciones
                </a>
            </li>
            
            <li>
                <a href="../../index.html">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Cerrar Sesión
                </a>
            </li>

        </ul>

    </div>

    <!-- CONTENIDO -->

    <main>

        <header>

            <div>
                <h1>Nuevo Vuelo</h1>
                <p>Programación de un nuevo vuelo</p>
            </div>

            
            <a href="vuelos.html" class="btn-primary">
                <i class="fa-solid fa-arrow-left"></i>
                Volver
            </a>

        </header>

        <section class="form-container">

            <form class="form-grid">

                <!-- INFORMACIÓN GENERAL -->

                <div class="form-group">

                    <label>Número de Vuelo</label>

                    <input
                        type="text"
                        placeholder="AM102">

                </div>

                <div class="form-group">

                    <label>Aerolínea</label>

                    <select>
                        <option>Seleccionar Aerolínea</option>
                        <option>Aeroméxico</option>
                        <option>Volaris</option>
                        <option>Viva Aerobus</option>
                    </select>

                </div>

                <div class="form-group">

                    <label>Ruta</label>

                    <select>
                        <option>MEX ➜ CUN</option>
                        <option>MEX ➜ MTY</option>
                        <option>GDL ➜ TIJ</option>
                    </select>

                </div>

                <div class="form-group">

                    <label>Aeronave</label>

                    <select>
                        <option>XA-AMX | Boeing 737-800</option>
                        <option>XA-VOL | Airbus A320</option>
                        <option>XA-VIV | Airbus A321</option>
                    </select>

                </div>

                <!-- FECHAS -->

                <div class="form-group">

                    <label>Fecha de Salida</label>

                    <input type="date">

                </div>

                <div class="form-group">

                    <label>Hora de Salida</label>

                    <input type="time">

                </div>

                <div class="form-group">

                    <label>Fecha de Llegada</label>

                    <input type="date">

                </div>

                <div class="form-group">

                    <label>Hora de Llegada</label>

                    <input type="time">

                </div>

                <!-- OPERACIÓN -->

                <div class="form-group">

                    <label>Puerta de Embarque</label>

                    <select>
                        <option>A01</option>
                        <option>A02</option>
                        <option>A03</option>
                        <option>B01</option>
                        <option>B02</option>
                    </select>

                </div>

                <div class="form-group">

                    <label>Estado</label>

                    <select>
                        <option>Programado</option>
                        <option>Abordando</option>
                        <option>En Vuelo</option>
                        <option>Retrasado</option>
                        <option>Cancelado</option>
                    </select>

                </div>

                <div class="form-group">

                    <label>Asientos Disponibles</label>

                    <input
                        type="number"
                        placeholder="180">

                </div>

                <div class="form-group">

                    <label>Precio Base ($)</label>

                    <input
                        type="number"
                        placeholder="3500">

                </div>

                <!-- OBSERVACIONES -->

                <div class="form-group full-width">

                    <label>Observaciones</label>

                    <textarea rows="5"
                        placeholder="Comentarios adicionales del vuelo"></textarea>

                </div>

                <!-- BOTONES -->

                <div class="form-actions">

                    <a href="vuelos.html"
                        class="btn-cancel">

                        Cancelar

                    </a>

                    <button
                        type="submit"
                        class="btn-save">

                        <i class="fa-solid fa-floppy-disk"></i>
                        Guardar Vuelo

                    </button>

                </div>

            </form>

        </section>

    </main>

</body>

</html>
