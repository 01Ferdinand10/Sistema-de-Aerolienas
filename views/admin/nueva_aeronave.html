<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Aeronave | Sistema Aeroportuario</title>

    <link rel="stylesheet" href="../../Assets/css/admin.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="sidebar">
        <div class="logo">
            <i class="fa-solid fa-plane"></i>
            <h2>Aeropuerto</h2>
        </div>
        <ul>
            <li>
                <a href="admin.html">
                    <i class="fa-solid fa-chart-line"></i> Dashboard
                </a>
            </li>
            <li>
                <a href="aerolineas.html">
                    <i class="fa-solid fa-building"></i> Aerolíneas
                </a>
            </li>
            <li class="active">
                <a href="aeronaves.html">
                    <i class="fa-solid fa-plane-circle-check"></i> Aeronaves
                </a>
            </li>
            <li>
                <a href="rutas.html">
                    <i class="fa-solid fa-route"></i> Rutas
                </a>
            </li>
            <li>
                <a href="vuelos.html">
                    <i class="fa-solid fa-plane-departure"></i> Vuelos
                </a>
            </li>
            <li>
                <a href="pasajeros.html">
                    <i class="fa-solid fa-users"></i> Pasajeros
                </a>
            </li>
            <li>
                <a href="tripulacion.html">
                    <i class="fa-solid fa-user-tie"></i> Tripulación
                </a>
            </li>
            <li>
                <a href="tripulacion_vuelo.html">
                    <i class="fa-solid fa-users-gear"></i> Asignación de Tripulación
                </a>
            </li>   
            <li>
                <a href="../../index.html">
                    <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
                </a>
            </li>
        </ul>
    </div>

    <main>
        <header>
            <div>
                <h1>Nueva Aeronave</h1>
                <p>Registro de una nueva aeronave en el sistema</p>
            </div>
            <a href="aeronaves.html" class="btn-primary">
                <i class="fa-solid fa-arrow-left"></i> Volver
            </a>
        </header>

        <section class="form-container">
            <form id="nuevaAeronave"  class="form-grid">
                <div class="form-group">
                    <label>Aerolínea</label>
 
                    <select id="aerolinea_id">
                        <option value="">Seleccionar Aerolínea</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Modelo</label>
                    <input id="modelo" type="text" placeholder="Boeing 737-800">
                </div>
                <div class="form-group">
                    <label>Capacidad de Carga</label>
                    <input id="cap_carga" type="number" placeholder="20kg" min="20">
                </div>
                <div class="form-group">
                    <label>Capacidad de Pasajeros</label>
                    <input id="cap_pasajeros" type="number" placeholder="180" min="1">
                </div>
                <div class="form-group">
                    <label>Estado</label>

                    <select id="estado">
                        <option value="Activo">Activo</option>
                        <option value="Inactivo">Inactivo</option>
                        <option value="Mantenimiento">Mantenimiento</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Año de Fabricacion</label>
                    <input id="fabrication" type="date" placeholder="2010">
                </div>
                <div class="form-group">
                    <label>Último Mantenimiento</label>
                    <input id="ult_mant" type="date">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-save">
                        <i class="fa-solid fa-floppy-disk"></i> Guardar Aeronave
                    </button>
                </div>
            </form>
        </section>
    </main>
</body>
<script src="../../Assets/JS/Admin/nueva_aeronave.js"></script>
</html>
