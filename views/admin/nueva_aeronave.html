<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Aeronave | Sistema Aeroportuario</title>

    <link rel="stylesheet" href="../../Assets/css/admin.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-plane"></i>
            <h2>Aeropuerto</h2>
        </div>

        <ul>

            <li>
                <a href="admin.html">
                    <i class="fa-solid fa-chart-line"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="aerolineas.html">
                    <i class="fa-solid fa-building"></i>
                    Aerolíneas
                </a>
            </li>

            <li class="active">
                <a href="aeronaves.html">
                    <i class="fa-solid fa-plane-circle-check"></i>
                    Aeronaves
                </a>
            </li>

            <li>
                <a href="rutas.html">
                    <i class="fa-solid fa-route"></i>
                    Rutas
                </a>
            </li>

            <li>
                <a href="vuelos.html">
                    <i class="fa-solid fa-plane-departure"></i>
                    Vuelos
                </a>
            </li>

            <li>
                <a href="pasajeros.html">
                    <i class="fa-solid fa-users"></i>
                    Pasajeros
                </a>
            </li>

            <li>
                <a href="tripulacion.html">
                    <i class="fa-solid fa-user-tie"></i>
                    Tripulación
                </a>
            </li>

            <li>
                <a href="tripulacion_vuelo.html">
                    <i class="fa-solid fa-users-gear"></i>
                    Asignación de Tripulación
                </a>
            </li>

            <li>
                <a href="vistas.html">
                    <i class="fa-solid fa-eye"></i>
                    Vistas SQL
                </a>
            </li>

            <li>
                <a href="procedimientos.html">
                    <i class="fa-solid fa-gears"></i>
                    Procedimientos
                </a>
            </li>

            <li>
                <a href="triggers.html">
                    <i class="fa-solid fa-bolt"></i>
                    Triggers
                </a>
            </li>

            <li>
                <a href="transacciones.html">
                    <i class="fa-solid fa-database"></i>
                    Transacciones
                </a>
            </li>
            
            <li>
                <a href="../../index.html">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Cerrar Sesión
                </a>
            </li>

        </ul>

    </div>

    <main>

        <header>

            <div>
                <h1>Nueva Aeronave</h1>
                <p>Registro de una nueva aeronave en el sistema</p>
            </div>

            <a href="aeronaves.html" class="btn-primary">
                <i class="fa-solid fa-arrow-left"></i>
                Volver

            </a>

        </header>

        <section class="form-container">

            <form class="form-grid">

                <div class="form-group">

                    <label>Matrícula</label>

                    <input
                        type="text"
                        placeholder="Ej. XA-AMX">

                </div>

                <div class="form-group">

                    <label>Modelo</label>

                    <input
                        type="text"
                        placeholder="Boeing 737-800">

                </div>

                <div class="form-group">

                    <label>Aerolínea</label>

                    <select>
                        <option>Seleccionar Aerolínea</option>
                        <option>Aeroméxico</option>
                        <option>Volaris</option>
                        <option>Viva Aerobus</option>
                    </select>

                </div>

                <div class="form-group">

                    <label>Capacidad de Pasajeros</label>

                    <input
                        type="number"
                        placeholder="180">

                </div>

                <div class="form-group">

                    <label>Estado</label>

                    <select>
                        <option>Activo</option>
                        <option>Mantenimiento</option>
                        <option>Fuera de Servicio</option>
                    </select>

                </div>

                <div class="form-group">

                    <label>Último Mantenimiento</label>

                    <input type="date">

                </div>

                <div class="form-group full-width">

                    <label>Observaciones</label>

                    <textarea rows="5"
                        placeholder="Comentarios adicionales sobre la aeronave"></textarea>

                </div>

                <div class="form-actions">

                    <a href="aeronaves.html"
                        class="btn-cancel">

                        Cancelar

                    </a>

                    <button
                        type="submit"
                        class="btn-save">

                        <i class="fa-solid fa-floppy-disk"></i>
                        Guardar Aeronave

                    </button>

                </div>

            </form>

        </section>

    </main>

</body>

</html>
